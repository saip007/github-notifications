<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Notifications Browser Extension</title>
    <!-- <link rel="stylesheet" href="../styles/tailwind.css" /> -->
    <link rel="stylesheet" href="../styles/style.css" />
    <script type="module" src="../scripts/popup.js"></script>
</head>

<body class="bg-gray-100 w-80 p-4 text-sm font-sans">
    <div class="top-header">
    <h1 class="text-lg font-bold text-center mb-4">🔔 GitHub Notifications</h1>
    <div id="refresh-btn" class="refresh-button" role="button" tabindex="0" aria-label="Refresh notifications">⟳</div>
    </div>
    <p id="status" class="text-center text-gray-500 mt-3 text-xs"></p>
    <button id="login-btn" class="bg-black text-white w-full py-2 rounded mb-4" aria-label="Continue with GitHub">
        Continue with GitHub
    </button>
    <div id="notification-list" class="space-y-2">
        <!-- notifications rendered here -->
    </div>
    <button id="mark-all-btn" class="hidden mark-all-btn" aria-label="Mark all notifications as read">✓ Mark all as read</button>
    <button id="signout-btn" class="bg-red-600 text-white w-full py-2 rounded mb-4 hidden" aria-label="Sign out">
        Sign Out
    </button>
    <div class="separator"></div>
    <div class="footer">
        <p class="space-x-2">
            <a href="https://github.com/saip007/github-notifications" target="_blank" rel="noopener noreferrer">
                📦 GitHub Repo
            </a>
            |
            <a href="https://github.com/saip007/github-notifications/issues/new" target="_blank" rel="noopener noreferrer">
                🐞 Raise an Issue
            </a>
            |
            <a href="https://github.com/sponsors/saip007" target="_blank" rel="noopener noreferrer">
                ❤️ Sponsor
            </a>
        </p>
    </div>
</body>

</html>
